<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed</title>
<style>
  :root {
    --ink: #1b2521;
    --paper: #f6f4ef;
    --moss: #2f6f4f;
    --moss-deep: #234f39;
    --line: #d8d3c6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--moss);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark svg {
    width: 26px;
    height: 26px;
    stroke: var(--paper);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw 0.5s ease-out 0.15s forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  p {
    font-size: 15px;
    line-height: 1.55;
    color: #566058;
    margin: 0 0 30px;
  }

  button {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    padding: 11px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button:hover {
    border-color: var(--moss);
    background: rgba(47, 111, 79, 0.06);
  }

  button:focus-visible {
    outline: 2px solid var(--moss);
    outline-offset: 2px;
  }

  .hint {
    margin-top: 16px;
    font-size: 12.5px;
    color: #8a8f87;
  }

  .hint.hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .mark svg { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>
    </div>
    <h1>Your email is confirmed</h1>
    <p>You're all set. You can close this tab now, or use the button below.</p>
    <button id="closeBtn" onclick="attemptClose()">Close this tab</button>
    <p class="hint" id="hint">If nothing happens, it's safe to close this tab yourself.</p>
  </div>

  <script>
    function attemptClose() {
      window.close();
      // If the tab is still open after a brief moment, the browser blocked it.
      setTimeout(function () {
        document.getElementById('hint').classList.remove('hidden');
      }, 150);
    }
  </script>
</body>
</html>
